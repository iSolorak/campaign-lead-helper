{% load static %}<!doctype html>
<html lang="en" data-theme="{{ request.session.theme|default:'dark' }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Lead Dashboard{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{% static 'leads/app.css' %}" rel="stylesheet">
<script src="https://unpkg.com/htmx.org@2.0.4"></script></head>
<body><header class="topbar"><div class="shell topbar-inner"><a class="brand" href="{% url 'dashboard' %}"><span class="brand-mark">L</span><span>Leadboard</span></a>{% if user.is_staff %}<button class="nav-toggle" type="button" aria-label="Toggle navigation" onclick="document.querySelector('.main-nav').classList.toggle('open')">☰</button><nav class="main-nav"><a href="{% url 'dashboard' %}">Overview</a><a href="{% url 'lead-list' %}">Leads</a><a href="{% url 'campaign-list' %}">Campaigns</a><a href="{% url 'email-template-list' %}">Email templates</a><a href="{% url 'integration-settings' %}">Settings</a><form method="post" action="{% url 'toggle-theme' %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button class="nav-link-button" aria-label="Toggle color theme">{% if request.session.theme == 'light' %}Dark mode{% else %}Light mode{% endif %}</button></form><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="nav-link-button">Log out</button></form></nav>{% endif %}</div></header>
<main class="shell page-content">{% for message in messages %}<div class="notice notice-{{ message.tags|default:'info' }}">{{ message|linebreaksbr }}</div>{% endfor %}{% block content %}{% endblock %}</main>
</body></html>
