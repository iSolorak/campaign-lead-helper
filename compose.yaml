services:
  web:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "8101:8000"
    environment:
      SQLITE_PATH: /data/db.sqlite3
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-docker-development-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-Europe/Athens}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-False}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      PAGESPEED_FRESHNESS_DAYS: ${PAGESPEED_FRESHNESS_DAYS:-30}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    volumes:
      - lead_data:/data

volumes:
  lead_data:
